<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal financial tracker - income, expenses, budgets and goals">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-currency="{{ currency }}">

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">💰</span>
        <span class="brand-name">{{ app_name }}</span>
      </div>

      <nav class="sidebar-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-link {{ 'active' if active_page == 'dashboard' }}">
          <span class="nav-icon">▦</span>Dashboard
        </a>
        <a href="{{ url_for('transactions_page') }}" class="nav-link {{ 'active' if active_page == 'transactions' }}">
          <span class="nav-icon">⇄</span>Transactions
        </a>
        <a href="{{ url_for('budgets_page') }}" class="nav-link {{ 'active' if active_page == 'budgets' }}">
          <span class="nav-icon">◔</span>Budgets
        </a>
        <a href="{{ url_for('goals_page') }}" class="nav-link {{ 'active' if active_page == 'goals' }}">
          <span class="nav-icon">◎</span>Goals
        </a>
        <a href="{{ url_for('reports_page') }}" class="nav-link {{ 'active' if active_page == 'reports' }}">
          <span class="nav-icon">▤</span>Reports
        </a>
        <a href="{{ url_for('settings_page') }}" class="nav-link {{ 'active' if active_page == 'settings' }}">
          <span class="nav-icon">⚙</span>Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <p class="sidebar-copy">&copy; {{ current_year }} {{ app_name }}</p>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm btn-block" style="margin-top: 10px;">Logout</a>
        {% endif %}
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">
          <span class="hamburger"></span>
        </button>
        <h1 class="topbar-title">{% block page_title %}{% endblock %}</h1>
        <div class="topbar-right">
          <span class="topbar-date" id="topbar-date"></span>
        </div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title"></h3>
        <button class="icon-btn modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
